name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build signed APK
        run: gradle assembleRelease --stacktrace --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk QuestPredTuner.apk

      - uses: actions/upload-artifact@v4
        with:
          name: QuestPredTuner
          path: QuestPredTuner.apk

      # Puts the APK at a fixed link you can open in the Quest browser:
      # https://github.com/<you>/<repo>/releases/latest/download/QuestPredTuner.apk
      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: QuestPredTuner.apk
          make_latest: true
